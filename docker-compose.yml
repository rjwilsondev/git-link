version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=file:/app/data/dev.db

  git-service:
    build:
      context: .
      dockerfile: apps/git-service/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - REPOS_ROOT=/app/data/repositories
